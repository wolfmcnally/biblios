  covers:
  - project/tests/conftest.py
  - project/tests/test_hermeticity.py
  contract: Routine product tests cannot silently regain network access.
  risk_class: isolation
  oracle: A real socket connection attempt fails through the armed pytest guard.
  admission: Hermeticity is checked with the complete product suite.
  nearest_overlap: No other retained family exercises this contract directly; retained
    for the bounded applicability review.
  tier: changed
  flake_rate: 0.0
  replacement_lineage: []
