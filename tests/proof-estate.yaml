schema: agentic.proof_estate.v5
baseline_report: reports/test-governance/biblios-baseline.json
audit_ledger: reports/test-governance/biblios-ledger.jsonl
witness_ledger: reports/test-governance/biblios-witnesses.jsonl
witness_failure_lines: ^E\s
adoption:
  mode: bounded
  reason: 'Fresh stamp from the agentic starter template on 2026-11-06. Every inherited
    methodology proof is retained and executable; none has a recorded disposition
    yet. Review plan: the first product phase (shelf-core-library) admits its own
    proofs with witnesses; the first governed sweep after that phase reviews inherited
    families in batches grouped by contract, starting with the toolchain and gate
    families this repository adapted (atomic-check, toolchain-entrypoints, full-gate-receipt).'
hang_timeout_seconds: 1800
mutation:
  tool: cosmic-ray
  paths:
  - project/biblios/*.py
  budget_seconds: 300
critical_risks:
  custody:
    state: applicable
    direct_proof: pytest:tests/test_check_receipt.py::test_passed_run_is_durable_and_reusable_for_exact_clean_head
  security:
    state: applicable
    direct_proof: pytest:project/tests/test_hermeticity.py::test_real_network_egress_fails_loudly
  authority:
    state: applicable
    direct_proof: pytest:tests/test_kickoff_evidence.py::test_change_manifest_is_candidate_bound_and_detects_authority_drift
  concurrency:
    state: applicable
    direct_proof: pytest:tests/test_execution_telemetry.py::test_concurrent_process_mutations_do_not_lose_spans
  atomicity:
    state: applicable
    direct_proof: pytest:tests/test_kickoff_config.py::test_invalid_edit_is_atomic
  corruption:
    state: applicable
    direct_proof: pytest:tests/test_kickoff_evidence.py::test_validate_detects_corrupt_evidence
  recovery:
    state: applicable
    direct_proof: pytest:tests/test_execution_telemetry.py::test_lifecycle_idempotency_finalization_and_crash_recovery
  public-contract:
    state: applicable
    direct_proof: pytest:project/tests/test_shelf.py::test_init_creates_the_layout_and_declares_the_embedder_to_palace_only
  schema:
    state: applicable
    direct_proof: pytest:tests/test_test_governance.py::test_live_reset_validates
  core-success:
    state: applicable
    direct_proof: pytest:tests/test_check.py::test_all_is_default_locked_ordered_and_cwd_independent
  deploy:
    state: applicable
    direct_proof: pytest:tests/test_documentation.py::test_deploy_binds_clean_latest_release_and_preserves_manual_mode
families:
- id: shelf-manifest-seed
  kind: pytest
  selectors:
  - project/tests/test_shelf.py
  source_paths:
  - project/biblios/**
  - project/pyproject.toml
  - project/tests/test_shelf.py
  covers:
  - project/biblios/**
  - project/pyproject.toml
  - project/tests/test_shelf.py
  contract: init creates the five-part shelf layout, declares the embedder to Palace
    alone, and a manifest of another schema or with bad fields is refused.
  risk_class: product-contract
  oracle: Over a temporary shelf the layout files exist, the selector file names the
    declared provider, no manifest field or key mentions an embedder, and open or
    construction refuses a wrong schema, an empty id and an unknown mode.
  admission: Replaces the stamped seed proof with layout proofs over a shelf on disk
    (first product phase).
  nearest_overlap: shelf-curation exercises the same shelf object but asserts nothing
    about layout or manifest refusal.
  tier: changed
  flake_rate: 0.0
  replacement_lineage: []
